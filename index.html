<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      padding: 50px 20px;
    }

    .btn {
      display: inline-block;
      padding: 15px 25px;
      background: #e50914;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
    }

    #timer {
      margin-top: 20px;
      font-size: 16px;
      color: #ccc;
    }
  </style>
</head>

<body>

  <div class="container">

    <h2>Silakan Tunggu...</h2>

    <p id="timer">
      Anda akan diarahkan dalam 15 detik
    </p>

    <a
      class="btn"
      href="https://tv12.lk21official.cc/"
      target="_blank"
      rel="noopener noreferrer"
    >
      Buka Video
    </a>

  </div>

  <script>
    let waktu = 15;
    const timer = document.getElementById("timer");

    const countdown = setInterval(function () {
      waktu--;

      timer.textContent =
        "Anda akan diarahkan dalam " + waktu + " detik";

      if (waktu <= 0) {
        clearInterval(countdown);

        window.location.href =
          "https://www.effectivecpmnetwork.com/jajsmmts?key=3379e30611a4277cdd49864562b580a3";
      }
    }, 1000);
  </script>
